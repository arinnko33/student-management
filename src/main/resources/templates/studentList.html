<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>受講生一覧</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 40px;
    }

    h1 {
      margin-bottom: 20px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th, td {
      border: 1px solid #999;
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: #eee;
    }
  </style>
</head>

<body>

<h1>受講生一覧</h1>

<table>
  <thead>
  <tr>
    <th>ID</th>
    <th>名前</th>
    <th>カナ名</th>
    <th>ニックネーム</th>
    <th>メールアドレス</th>
    <th>地域</th>
    <th>年齢</th>
    <th>性別</th>
    <th>備考</th>
    <th>コース名</th>
    <th>開始日</th>
    <th>終了日</th>
  </tr>
  </thead>

  <tbody>
  <tr th:each="detail : ${studentDetails}">
    <td th:text="${detail.student.id}"></td>

    <td>
      <a th:href="@{/students/{id}/edit(id=${detail.student.id})}"
         th:text="${detail.student.name}">
      </a>
    </td>

    <td th:text="${detail.student.furigana}"></td>
    <td th:text="${detail.student.nickname}"></td>
    <td th:text="${detail.student.email}"></td>
    <td th:text="${detail.student.region}"></td>
    <td th:text="${detail.student.age}"></td>
    <td th:text="${detail.student.gender}"></td>
    <td th:text="${detail.student.note}"></td>

    <td>
      <div th:each="course : ${detail.studentCourses}">
        <span th:text="${course.courseName}"></span>
      </div>
    </td>

    <td>
      <div th:each="course : ${detail.studentCourses}">
        <span th:text="${course.startDate}"></span>
      </div>
    </td>

    <td>
      <div th:each="course : ${detail.studentCourses}">
        <span th:text="${course.endDate}"></span>
      </div>
    </td>
  </tr>
  </tbody>
</table>

</body>
</html>
