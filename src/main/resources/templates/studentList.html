<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>受講生一覧</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 40px;
    }

    h1 {
      margin-bottom: 20px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th, td {
      border: 1px solid #999;
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: #eee;
    }
  </style>
</head>

<body>

<h1>受講生一覧</h1>

<table>
  <thead>
  <tr>
    <th>ID</th>
    <th>名前</th>
    <th>カナ名</th>
    <th>ニックネーム</th>
    <th>メールアドレス</th>
    <th>年齢</th>
    <th>性別</th>
    <th>備考</th>
  </tr>
  </thead>

  <tbody>
  <tr th:each="student : ${students}">
    <td th:text="${student.id}"></td>
    <td th:text="${student.name}"></td>
    <td th:text="${student.furigana}"></td>
    <td th:text="${student.nickname}"></td>
    <td th:text="${student.email}"></td>
    <td th:text="${student.age}"></td>
    <td th:text="${student.gender}"></td>
    <td th:text="${student.note}"></td>
  </tr>
  </tbody>
</table>

</body>
</html>
