<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>受講生登録</title>
</head>
<body>

<h1>新規受講生登録</h1>

<form th:action="@{/students}" th:object="${student}" method="post">

  <div>
    <label>名前：</label>
    <input type="text" th:field="*{name}">
  </div>

  <div>
    <label>ニックネーム：</label>
    <input type="text" th:field="*{nickname}">
  </div>

  <div>
    <label>ふりがな：</label>
    <input type="text" th:field="*{furigana}">
  </div>

  <div>
    <label>年齢：</label>
    <input type="number" th:field="*{age}">
  </div>

  <div>
    <label>性別：</label>
    <input type="text" th:field="*{gender}">
  </div>

  <div>
    <label>メールアドレス：</label>
    <input type="email" th:field="*{email}">
  </div>

  <div>
    <label>備考：</label>
    <textarea th:field="*{note}"></textarea>
  </div>

  <div>
    <label>コース：</label>
    <select name="courseName">
      <option value="Javaコース">Javaコース</option>
      <option value="Spring Bootコース">Spring Bootコース</option>
      <option value="Webコース">Webコース</option>
    </select>
  </div>

  <div>
    <label>受講開始日：</label>
    <input type="date" name="startDate">
  </div>

  <div>
    <label>受講終了日：</label>
    <input type="date" name="endDate">
  </div>

  <button type="submit">登録</button>

</form>

</body>
</html>
